name: Game Name Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "config/sources.json"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "app.js"
      - "index.html"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

concurrency:
  group: game-name-radar
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_MARKET: US_GLOBAL
      SEO_REGION: US
      SEO_LANGUAGE: en-US

      # Disable direct/free Google verification paths.
      SEO_VERIFY_LIMIT: 0
      SEO_EXPAND_LIMIT: 0
      TRENDS_VERIFY_LIMIT: 0
      YOUTUBE_VERIFY_LIMIT: 0

      # Third-party Google Search provider: Serper.dev.
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      SERPER_VERIFY_LIMIT: 800
      SERPER_ONLINE_LIMIT: 560
      SERPER_WIKI_LIMIT: 240
      SERPER_TOTAL_LIMIT: 2450
      SERPER_DAILY_LIMIT: 2450

      # When Serper is unavailable, strong multi-platform evidence can route a
      # candidate to Trends provisionally. It can never create an independent
      # recommendation until a real SERP provider confirms search intent.
      SEO_EVIDENCE_FALLBACK_LIMIT: 300

      # Google Trends provider pool: each key is a separate SerpApi account.
      # Keep every configured key in the job environment so both quota checks
      # and the pooled verifier see the same accounts.
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      SERPAPI_API_KEY_2: ${{ secrets.SERPAPI_API_KEY_2 }}
      SERPAPI_API_KEY_3: ${{ secrets.SERPAPI_API_KEY_3 }}
      SERPAPI_API_KEY_4: ${{ secrets.SERPAPI_API_KEY_4 }}
      SERPAPI_API_KEY_5: ${{ secrets.SERPAPI_API_KEY_5 }}
      SERPAPI_MONTHLY_LIMIT: 245
      SERPAPI_DAILY_LIMIT: 245
      SERPAPI_FILL_ENABLED: true
      SERPAPI_ONLINE_LIMIT: 999
      SERPAPI_WIKI_LIMIT: 999
      SERPAPI_FLEX_LIMIT: 999

      # SearchApi Google Trends fallback. Single concurrency is slower but much
      # more reliable than the previous three simultaneous browser jobs.
      SEARCHAPI_API_KEY: ${{ secrets.SEARCHAPI_API_KEY }}
      SEARCHAPI_TRENDS_ENABLED: true
      SEARCHAPI_TRENDS_VERIFY_LIMIT: 95
      SEARCHAPI_TRENDS_ONLINE_LIMIT: 67
      SEARCHAPI_TRENDS_WIKI_LIMIT: 28
      SEARCHAPI_TRENDS_CONCURRENCY: 1
      SEARCHAPI_TOTAL_LIMIT: 95
      SEARCHAPI_TIMEOUT_MS: 90000

      # Keep Apify connected for account visibility, but disable all Actor calls.
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      APIFY_TRENDS_ENABLED: false
      APIFY_TRENDS_VERIFY_LIMIT: 0
      APIFY_TRENDS_ONLINE_LIMIT: 0
      APIFY_TRENDS_WIKI_LIMIT: 0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install scanner dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Apify account token without running an Actor
        run: node scripts/check-apify-account.mjs

      - name: Run parser and scoring tests
        continue-on-error: true
        run: npm test

      - name: Discover games and build source evidence
        run: npm run scan

      - name: Classify online and wiki channels before verification
        run: npm run classify

      - name: Verify fresh SEO candidates with Serper
        run: node scripts/verify-serper.mjs

      - name: Diagnose pending evidence candidates
        run: node scripts/diagnose-evidence-fallback.mjs

      - name: Route strong candidates with quota-free platform evidence
        run: node scripts/verify-evidence-fallback.mjs

      - name: Recalculate typed site classification
        run: npm run classify

      - name: Inspect all SerpApi account quotas without spending searches
        run: node scripts/check-serpapi-accounts.mjs

      - name: Verify eligible Trends candidates with SerpApi account pool
        run: node scripts/fill-serpapi-pool.mjs

      - name: Restore SerpApi usage report
        run: node scripts/fill-serpapi-pool.mjs --report-only

      - name: Fill remaining Trends queue with SearchApi
        run: node scripts/fill-searchapi-trends.mjs

      - name: Finalize online and wiki opportunity counts
        run: npm run classify

      - name: Commit updated result data
        run: |
          if git diff --quiet -- data/; then
            echo "No radar changes"
            exit 0
          fi
          git config user.name "game-radar-bot"
          git config user.email "game-radar-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: scan and verify game opportunities"
          git push
